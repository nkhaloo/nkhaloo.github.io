<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal</title>
    <link rel="stylesheet" href="../assets/style.css">
    <script>
      (function() {
        const path = window.location.pathname;
        if (path.endsWith("/index.html")) {
          const cleanPath = path.replace(/\/index\.html$/, "/");
          const cleanUrl = new URL(cleanPath + window.location.search + window.location.hash, window.location.href).toString();
          if (cleanUrl !== window.location.href) {
            window.location.replace(cleanUrl);
          }
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="masthead">
      <nav class="navigation" aria-label="Primary navigation">

        <a href="../personal/" aria-current="page">Personal</a>
        <a href="../contact/">Contact</a>
      </nav>
    </header>
    <main id="main" class="personal-page" tabindex="-1" aria-label="Personal photo gallery">
      <p class="personal-intro">In my free time, I like to surf, camp, cook, and spend time with my friends. Here are some photos and videos of that.</p>
      <div class="personal-gallery">
        <figure class="personal-gallery-wide">
          <img src="../assets/personal/truck-swimming-hole.png" alt="A white pickup truck beside a rocky swimming hole">
          <figcaption>My friend Gabe at the Smith River in Gasquet, CA.</figcaption>
        </figure>
        <figure class="personal-gallery-wide">
          <img src="../assets/personal/avery-stampede-pass.png" alt="Avery overlooking the forested mountains at Stampede Pass, Washington">
          <figcaption>My girlfriend Avery overlooking Stampede Pass, WA.</figcaption>
        </figure>
        <figure>
          <img src="../assets/personal/alpine-lake.png" alt="Standing beside an alpine lake and snowy mountains">
          <figcaption>Me by one of the Cottonwood Lakes, CA.</figcaption>
        </figure>
        <figure>
          <img src="../assets/personal/backpacking.png" alt="Backpackers crossing a rocky mountain stream">
          <figcaption>Backpacking near Lone Pine, CA.</figcaption>
        </figure>
        <figure>
          <img src="../assets/personal/collie-hills.png" alt="A collie standing in grass among rolling hills">
          <figcaption>Betty.</figcaption>
        </figure>
        <figure class="personal-gallery-wide">
          <video controls playsinline preload="metadata" poster="../assets/personal/surfers.png">
            <source src="../assets/personal/surfers.mp4" type="video/mp4">
            Your browser does not support video playback.
